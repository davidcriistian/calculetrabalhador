<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categoria do Blog | Calcule Trabalhador</title>
  <meta name="description" content="Conteudos do Calcule Trabalhador organizados por categoria." />
  <meta name="robots" content="index, follow" />
  <link id="canonicalLink" rel="canonical" href="https://calculetrabalhador.com.br/blog/categoria/" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/global-layout.css">

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="Calcule Trabalhador" />
  <meta property="og:title" content="Categoria do Blog | Calcule Trabalhador" />
  <meta property="og:description" content="Conteudos do Calcule Trabalhador organizados por categoria." />
  <meta property="og:url" content="https://calculetrabalhador.com.br/blog/categoria/" />

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #dbe3ef;
      --blue: #1d4ed8;
      --blue-soft: #eff6ff;
      --green: #166534;
      --green-soft: #dcfce7;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; }

    .hero {
      background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
      border-bottom: 1px solid var(--line);
    }

    .hero-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 44px 20px 34px;
    }

    .breadcrumb {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .breadcrumb a {
      color: var(--blue);
      text-decoration: none;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 820px;
      color: var(--text);
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .hero-description {
      max-width: 760px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 20px 54px;
    }

    .category-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px;
    }

    .category-nav a {
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      color: #334155;
      padding: 8px 13px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .category-nav a:hover,
    .category-nav a[aria-current="page"] {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .article-card {
      min-height: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .article-card:hover {
      transform: translateY(-2px);
      border-color: #bfdbfe;
      box-shadow: 0 20px 44px rgba(29, 78, 216, 0.12);
    }

    .article-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .article-icon {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: var(--blue-soft);
      color: var(--blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .article-category {
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .article-card h2 {
      margin: 0;
      color: var(--text);
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .article-card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      flex: 1;
    }

    .article-action {
      color: var(--blue);
      font-weight: 800;
      font-size: 14px;
    }

    .empty-state,
    .error-state {
      margin-top: 18px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      background: #fff;
    }

    .empty-state[hidden],
    .error-state[hidden] {
      display: none;
    }

    .empty-state strong,
    .error-state strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 6px;
    }

    @media (max-width: 900px) {
      .articles-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .hero-inner { padding-top: 34px; }
      .articles-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="global-header"></div>

  <section class="hero">
    <div class="hero-inner">
      <p id="breadcrumbTrail" class="breadcrumb"><a href="/">Home</a> / <a href="/blog/">Blog</a> / Categorias</p>
      <p class="eyebrow">Categoria</p>
      <h1 id="categoryTitle">Categoria do Blog</h1>
      <p id="categoryDescription" class="hero-description">Conteudos do Calcule Trabalhador organizados por categoria.</p>
    </div>
  </section>

  <main>
    <nav id="categoryNav" class="category-nav" aria-label="Explorar por categoria"></nav>

    <section aria-labelledby="articlesTitle">
      <h2 id="articlesTitle" class="eyebrow">Artigos da categoria</h2>
      <div id="articlesGrid" class="articles-grid"></div>

      <div id="emptyState" class="empty-state" hidden aria-live="polite">
        <strong>Nenhum artigo publicado nesta categoria.</strong>
        <p id="emptyMessage"></p>
      </div>

      <div id="errorState" class="error-state" hidden aria-live="polite">
        <strong>Categoria indisponivel.</strong>
        <p>Nao foi possivel carregar os dados desta categoria agora.</p>
      </div>
    </section>
  </main>

  <div id="global-footer"></div>

  <script src="/assets/js/nuclei.js"></script>
  <script>
    (() => {
      const titleEl = document.getElementById('categoryTitle');
      const descriptionEl = document.getElementById('categoryDescription');
      const articlesGrid = document.getElementById('articlesGrid');
      const categoryNav = document.getElementById('categoryNav');
      const emptyState = document.getElementById('emptyState');
      const emptyMessage = document.getElementById('emptyMessage');
      const errorState = document.getElementById('errorState');
      const canonicalLink = document.getElementById('canonicalLink');
      const breadcrumbTrail = document.getElementById('breadcrumbTrail');
      const origin = 'https://calculetrabalhador.com.br';

      const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));

      const getSlugFromPath = () => {
        const parts = window.location.pathname.split('/').filter(Boolean);
        const categoryIndex = parts.indexOf('categoria');
        return categoryIndex >= 0 ? parts[categoryIndex + 1] : '';
      };

      const setMeta = (nucleus) => {
        const title = nucleus.categoryTitle || nucleus.title;
        const description = nucleus.categoryDescription || nucleus.description;
        const path = nucleus.categoryUrl || `/blog/categoria/${nucleus.slug}/`;
        const url = `${origin}/${CTNuclei.stripSlashes(path)}/`;

        document.title = `${title} | Calcule Trabalhador`;
        document.querySelector('meta[name="description"]').setAttribute('content', description);
        document.querySelector('meta[property="og:title"]').setAttribute('content', `${title} | Calcule Trabalhador`);
        document.querySelector('meta[property="og:description"]').setAttribute('content', description);
        document.querySelector('meta[property="og:url"]').setAttribute('content', url);
        canonicalLink.setAttribute('href', url);
      };

      const renderBreadcrumb = (nucleus) => {
        breadcrumbTrail.innerHTML = `<a href="/">Home</a> / <a href="/blog/">Blog</a> / ${escapeHtml(nucleus.name)}`;
      };

      const renderNav = (nuclei, activeSlug) => {
        categoryNav.innerHTML = CTNuclei.getVisibleOnBlog(nuclei).map((nucleus) => {
          const current = nucleus.slug === activeSlug ? ' aria-current="page"' : '';
          return `<a href="/blog/categoria/${escapeHtml(nucleus.slug)}/"${current}>${escapeHtml(nucleus.name)}</a>`;
        }).join('');
      };

      const renderArticles = (articles, nucleus) => {
        if (!articles.length) {
          articlesGrid.innerHTML = '';
          emptyMessage.textContent = `Em breve, novos conteudos sobre ${nucleus.name} estarao disponiveis aqui.`;
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;
        articlesGrid.innerHTML = articles.map((article) => `
          <a class="article-card" href="${escapeHtml(CTNuclei.articleUrl(article))}">
            <span class="article-card-top">
              <span class="article-icon" aria-hidden="true">${escapeHtml(nucleus.name.slice(0, 2).toUpperCase())}</span>
              <span class="article-category">${escapeHtml(article.category || nucleus.name)}</span>
            </span>
            <h2>${escapeHtml(article.title)}</h2>
            <p>${escapeHtml(article.description)}</p>
            <span class="article-action">Ler artigo &rarr;</span>
          </a>
        `).join('');
      };

      Promise.all([
        CTNuclei.loadJson('/data/brain/nuclei.json'),
        CTNuclei.loadJson('/data/articles.json')
      ])
        .then(([nucleiPayload, articlesPayload]) => {
          const nuclei = CTNuclei.readItems(nucleiPayload);
          const articles = CTNuclei.readItems(articlesPayload);
          const slug = getSlugFromPath();
          const nucleus = CTNuclei.getNucleusBySlug(nuclei, slug);

          renderNav(nuclei, slug);

          if (!nucleus) {
            titleEl.textContent = 'Categoria nao encontrada';
            descriptionEl.textContent = 'Confira as categorias disponiveis no blog do Calcule Trabalhador.';
            errorState.hidden = false;
            return;
          }

          setMeta(nucleus);
          titleEl.textContent = nucleus.categoryTitle || nucleus.title;
          descriptionEl.textContent = nucleus.categoryDescription || nucleus.description;
          renderBreadcrumb(nucleus);
          renderArticles(CTNuclei.getArticlesByNucleus(articles, nucleus), nucleus);
        })
        .catch(() => {
          errorState.hidden = false;
        });
    })();
  </script>
  <script src="/assets/js/global-layout.js" defer></script>
</body>
</html>
