  <script type="module">
const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
                for (const addedNode of mutation.addedNodes) {
                        if (
                                addedNode.nodeType === Node.ELEMENT_NODE &&
                                (
                                        addedNode.tagName?.toLowerCase() === 'vite-error-overlay' ||
                                        addedNode.classList?.contains('backdrop')
                                )
                        ) {
                                handleViteOverlay(addedNode);
                        }
                }
        }
});

observer.observe(document.documentElement, {
        childList: true,
        subtree: true
});

function handleViteOverlay(node) {
        if (!node.shadowRoot) {
                return;
        }

        const backdrop = node.shadowRoot.querySelector('.backdrop');

        if (backdrop) {
                const overlayHtml = backdrop.outerHTML;
                const parser = new DOMParser();
                const doc = parser.parseFromString(overlayHtml, 'text/html');
                const messageBodyElement = doc.querySelector('.message-body');
                const fileElement = doc.querySelector('.file');
                const messageText = messageBodyElement ? messageBodyElement.textContent.trim() : '';
                const fileText = fileElement ? fileElement.textContent.trim() : '';
                const error = messageText + (fileText ? ' File:' + fileText : '');

                window.parent.postMessage({
                        type: 'horizons-vite-error',
                        error,
                }, '*');
        }
}

  <script type="module">
const originalConsoleError = console.error;
const MATCH_LINE_COL_REGEX = /:(\d+):(\d+)\)?\s*$/; // regex to match the :lineNum:colNum
const MATCH_AT_REGEX = /^\s*at\s+(?:async\s+)?(?:.*?\s+)?\(?/; // regex to remove the 'at' keyword and any 'async' or function name
const MATCH_PATH_REGEX = /^\//; // regex to remove the leading slash

function parseStackFrameLine(line) {
        const lineColMatch = line.match(MATCH_LINE_COL_REGEX);
        if (!lineColMatch) return null;
        const [, lineNum, colNum] = lineColMatch;
        const suffix = `:${lineNum}:${colNum}`;
        const idx = line.lastIndexOf(suffix);
        if (idx === -1) return null;
        const before = line.substring(0, idx);
        const path = before.replace(MATCH_AT_REGEX, '').trim();
        
        if (!path) return null;

        try {
                const pathname = new URL(path).pathname;
                const filePath = pathname.replace(MATCH_PATH_REGEX, '') || pathname;
                return `${filePath}:${lineNum}:${colNum}`;
        } catch (e) {
                const filePath = path.replace(MATCH_PATH_REGEX, '') || path;
                return `${filePath}:${lineNum}:${colNum}`;
        }
}

function getFilePathFromStack(stack, skipFrames = 0) {
        if (!stack || typeof stack !== 'string') return null;
        const lines = stack.split('\n').slice(1);

        const frames = lines.map(line => parseStackFrameLine(line.replace(/\r$/, ''))).filter(Boolean);

        return frames[skipFrames] ?? null;
}

console.error = function(...args) {
        originalConsoleError.apply(console, args);

        let errorString = '';
        let filePath = null;

        for (let i = 0; i < args.length; i++) {
                const arg = args[i];
                if (arg instanceof Error) {
                        filePath = getFilePathFromStack(arg.stack, 0);
                        errorString = `${arg.name}: ${arg.message}`;
                        if (filePath) {
                                errorString = `${errorString} at ${filePath}`;
                        }
                        break;
                }
        }

        if (!errorString) {
                errorString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
                const stack = new Error().stack;
                filePath = getFilePathFromStack(stack, 1);
                if (filePath) {
                        errorString = `${errorString} at ${filePath}`;
                }
        }

        window.parent.postMessage({
                type: 'horizons-console-error',
                error: errorString
        }, '*');
};
</script>
  <script type="module">
const originalFetch = window.fetch;

window.fetch = function(...args) {
        const url = args[0] instanceof Request ? args[0].url : args[0];

        // Skip WebSocket URLs
        if (url.startsWith('ws:') || url.startsWith('wss:')) {
                return originalFetch.apply(this, args);
        }

        return originalFetch.apply(this, args)
                .then(async response => {
                        const contentType = response.headers.get('Content-Type') || '';

                        // Exclude HTML document responses
                        const isDocumentResponse =
                                contentType.includes('text/html') ||
                                contentType.includes('application/xhtml+xml');

                        if (!response.ok && !isDocumentResponse) {
                                        const responseClone = response.clone();
                                        const errorFromRes = await responseClone.text();
                                        const requestUrl = response.url;
                                        console.error(`Fetch error from ${requestUrl}: ${errorFromRes}`);
                        }

                        return response;
                })
                .catch(error => {
                        if (!url.match(/.html?$/i)) {
                                console.error(error);
                        }

                        throw error;
                });
};

        <script>
          (function () {
            const TARGET_HREF = '/calculadora-seguro-desemprego-2026';
            const TARGET_TITLE = 'Calculadora Seguro-Desemprego 2026';
            const TARGET_DESCRIPTION = 'Calcule o valor das parcelas do seguro-desemprego com base na média dos últimos salários.';

            function normalizeHref(value) {
              return String(value || '').replace(/\/$/, '').toLowerCase();
            }

            function seguroCardExists() {
              return Array.from(document.querySelectorAll('a[href]')).some(function (anchor) {
                return normalizeHref(anchor.getAttribute('href')).includes('calculadora-seguro-desemprego-2026');
              });
            }

            function findCardContainer(anchor) {
              let current = anchor;

              for (let i = 0; i < 12 && current && current !== document.body; i += 1) {
                if (
                  current.querySelector &&
                  current.querySelector('h3') &&
                  current.querySelector('p') &&
                  current.querySelector('a[href]')
                ) {
                  return current;
                }

                current = current.parentElement;
              }

              return null;
            }

            function findReferenceCard() {
              const priorityLinks = [
                'calculadora-horas-extras-clt-2026',
                'calculadora-ferias-clt-2026',
                'calculadora-13-salario-2026',
                'calculadora-rescisao-clt-2026',
                'salario-liquido-clt-2026',
                'saque-aniversario-fgts'
              ];

              const anchors = Array.from(document.querySelectorAll('a[href]'));

              for (const linkPart of priorityLinks) {
                const anchor = anchors.find(function (a) {
                  return normalizeHref(a.getAttribute('href')).includes(linkPart);
                });

                if (anchor) {
                  const card = findCardContainer(anchor);
                  if (card && card.parentElement) return card;
                }
              }

              return null;
            }

            function createSeguroCard(referenceCard) {
              const card = referenceCard.cloneNode(true);

              const h3 = card.querySelector('h3');
              if (h3) h3.textContent = TARGET_TITLE;

              const p = card.querySelector('p');
              if (p) p.textContent = TARGET_DESCRIPTION;

              const link = card.querySelector('a[href]');
              if (link) {
                link.setAttribute('href', TARGET_HREF);
                link.textContent = 'Calcular agora →';
              }

              const badge = card.querySelector('.badge, .badge-new, [class*="badge"]');
              if (badge) badge.textContent = 'NOVO';

              const icon = card.querySelector('.icon, [class*="icon"]');
              if (icon) icon.innerHTML = '💼';

              return card;
            }

            function insertSeguroCard() {
              if (seguroCardExists()) return true;

              const referenceCard = findReferenceCard();
              if (!referenceCard || !referenceCard.parentElement) return false;

              const seguroCard = createSeguroCard(referenceCard);
              referenceCard.insertAdjacentElement('afterend', seguroCard);

              return true;
            }

            function startSeguroCardInjection() {
              let attempts = 0;
              const maxAttempts = 40;

              const interval = window.setInterval(function () {
                attempts += 1;

                const inserted = insertSeguroCard();

                if (inserted || attempts >= maxAttempts) {
                  window.clearInterval(interval);
                }
              }, 250);
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', startSeguroCardInjection);
            } else {
              startSeguroCardInjection();
            }
          })();
        </script>
